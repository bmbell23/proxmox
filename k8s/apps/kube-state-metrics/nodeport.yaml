# Scraped by Prometheus on dockerhost (Dakota): http://10.0.0.201:30808/metrics (any node IP works).
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-nodeport
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - {name: http-metrics, port: 8080, targetPort: http-metrics, nodePort: 30808}
