# Dictionary: the first real app on k3s (#31). The dockerhost copy (:8098) keeps running until Brandon approves this one.
# Image is built and published by bmbell23/Dictionary (Daphne). One replica: glossary.db is SQLite on a
# local-path volume, so it lives on one node and two writers would fight over it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dictionary-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dictionary
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: dictionary}
  template:
    metadata:
      labels: {app: dictionary}
    spec:
      containers:
        - name: dictionary
          image: ghcr.io/bmbell23/dictionary:1.0.4
          ports: [{containerPort: 3000}]
          env:
            - {name: TZ, value: America/New_York}
            - {name: DATA_DIR, value: /data}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 30, timeoutSeconds: 5}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: dictionary-data}
---
apiVersion: v1
kind: Service
metadata:
  name: dictionary
spec:
  selector: {app: dictionary}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dictionary
spec:
  ingressClassName: traefik
  rules:
    - host: dictionary.10.0.0.201.sslip.io
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: dictionary, port: {number: 80}}}}
---
# Weekly OEWN sync (#64): builds /data/dictionary.db. It writes a temp file and renames it, so it can run
# beside the server. local-path volumes live on one node, so the job follows the dictionary pod there.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dictionary-sync
spec:
  schedule: "0 5 * * 0"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector: {matchLabels: {app: dictionary}}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: sync
              image: ghcr.io/bmbell23/dictionary:1.0.4
              command: [node, sync-dictionary.js]
              env:
                - {name: TZ, value: America/New_York}
                - {name: DATA_DIR, value: /data}
              volumeMounts: [{name: data, mountPath: /data}]
              resources:
                requests: {cpu: 10m, memory: 128Mi}
                limits: {memory: 512Mi}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: dictionary-data}
